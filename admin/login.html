<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Admin Login — Elite Estates</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link rel="stylesheet" href="/src/styles/admin.css">
</head>
<body>
<div class="login-wrap">
  <div class="login-card">
    <div class="login-logo"><span class="mark"></span>Elite Estates</div>
    <p class="sub">Admin sign-in. This area is not for customer accounts.</p>

    <form id="loginForm" novalidate>
      <div class="form-field">
        <label for="loginEmail">Email</label>
        <input type="email" id="loginEmail" name="email" autocomplete="username" required>
        <div class="form-error" id="err-loginEmail"></div>
      </div>
      <div class="form-field">
        <label for="loginPassword">Password</label>
        <input type="password" id="loginPassword" name="password" autocomplete="current-password" required>
        <div class="form-error" id="err-loginPassword"></div>
      </div>
      <button type="submit" class="btn btn-primary" id="loginSubmitBtn">
        <span id="loginSubmitLabel">Sign In</span>
      </button>
      <div class="login-status" id="loginStatus" role="status" aria-live="polite"></div>
    </form>
  </div>
</div>
<script type="module" src="/src/admin/admin-login.js"></script>
</body>
</html>
